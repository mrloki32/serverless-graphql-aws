AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  gqlapp frontend - private S3 bucket + CloudFront (Origin Access Control),
  HTTPS only (ACM certificate for a custom domain, or the CloudFront default
  certificate), security headers, SPA routing and cache policies tuned for
  content-hashed assets. Each release lives under /releases/<git-sha>/ and
  the distribution's origin path selects the live release (instant rollback).

Parameters:
  AppName: { Type: String, Default: gqlapp }
  Stage: { Type: String, AllowedValues: [staging, prod] }
  ReleaseId:
    Type: String
    Default: initial
    AllowedPattern: '^[A-Za-z0-9._-]+$'
    Description: Release folder served by CloudFront (git SHA). Changing it = deploy / rollback.
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain, e.g. app.example.com
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate covering DomainName (required with DomainName; CloudFront only accepts certificates from the global ACM endpoint)
  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional public Route 53 zone for DomainName (creates the alias records)
  WebAclArn:
    Type: String
    Default: ''
    Description: Optional AWS WAF web ACL (CLOUDFRONT scope). Off by default for cost.

Conditions:
  CustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  CreateDns: !And [!Condition CustomDomain, !Not [!Equals [!Ref HostedZoneId, '']]]
  HasWaf: !Not [!Equals [!Ref WebAclArn, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-${Stage}-site-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-${Stage}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this CloudFront distribution can read the bucket; nobody can read it directly.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AppName}-${Stage}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              connect-src 'self'
              https://*.appsync-api.${AWS::Region}.amazonaws.com
              wss://*.appsync-realtime-api.${AWS::Region}.amazonaws.com
              https://cognito-idp.${AWS::Region}.amazonaws.com
              https://*.auth.${AWS::Region}.amazoncognito.com;
              frame-ancestors 'none';
              base-uri 'self';
              object-src 'none';
              form-action 'self'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AppName} ${Stage} web app'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100 # North America + Europe edges only: cheapest
        DefaultRootObject: index.html
        Aliases: !If [CustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - CustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWaf, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginPath: !Sub '/releases/${ReleaseId}'
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          # Hashed /assets/* files: cached at the edge per origin Cache-Control (1 year, immutable)
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          # Entry point + runtime config must always be fresh after a release/rollback.
          - PathPattern: /index.html
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          - PathPattern: /config.json
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # SPA routing: unknown paths (403 from S3 via OAC) render the app shell.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone id
  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !If
      - CustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
  ReleaseId:
    Value: !Ref ReleaseId
