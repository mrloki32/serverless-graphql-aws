AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  gqlapp private GraphQL server - ECS Fargate in private subnets behind an
  INTERNAL Application Load Balancer (reachable only from the Lambda security
  group). Secrets injected from Secrets Manager, read-only root FS, non-root,
  target-tracking auto scaling, circuit-breaker + alarm-based automatic rollback.

Parameters:
  AppName: { Type: String, Default: gqlapp }
  Stage: { Type: String, AllowedValues: [staging, prod] }
  ImageUri:
    Type: String
    Description: Immutable image tag, e.g. <account>.dkr.ecr.<region>.amazonaws.com/gqlapp/graphql-server:<git-sha>
  MinTasks: { Type: Number, Default: 1, MinValue: 1 }
  MaxTasks: { Type: Number, Default: 4, MinValue: 1 }
  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048']
  TaskMemory:
    Type: String
    Default: '512'
  UseFargateSpot:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Run on Fargate Spot (~70% cheaper, interruptible) - fine for staging
  LogRetentionDays: { Type: Number, Default: 30 }
  InternalCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate for HTTPS on the internal ALB (requires InternalDomainName + PrivateHostedZoneId)
  InternalDomainName: { Type: String, Default: '' }
  PrivateHostedZoneId: { Type: String, Default: '' }

Conditions:
  Spot: !Equals [!Ref UseFargateSpot, 'true']
  InternalTls: !Not [!Equals [!Ref InternalCertificateArn, '']]

Resources:
  # Shared secret proving a request comes from our Lambda resolvers (defence in
  # depth on top of the security groups). Generated inside Secrets Manager.
  InternalApiTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/${Stage}/internal-api-token'
      Description: Token required by the private GraphQL server (x-internal-token header)
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AppName}-${Stage}'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      DefaultCapacityProviderStrategy: !If
        - Spot
        - [{ CapacityProvider: FARGATE_SPOT, Weight: 1 }]
        - [{ CapacityProvider: FARGATE, Weight: 1 }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AppName}-${Stage}/graphql-server'
      RetentionInDays: !Ref LogRetentionDays

  # Used by the ECS agent only: pull the image, write logs, resolve secrets.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: inject-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-DbAppReadWriteSecretArn' }
                  - !Ref InternalApiTokenSecret

  # Assumed by the application code: it needs NO AWS permissions (credentials
  # arrive as env vars from the execution role), so it gets none.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AppName}-${Stage}-graphql-server'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes: [{ Name: tmp }]
      ContainerDefinitions:
        - Name: graphql-server
          Image: !Ref ImageUri
          Essential: true
          User: '1000'
          ReadonlyRootFilesystem: true
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          LinuxParameters: { InitProcessEnabled: true }
          StopTimeout: 30
          PortMappings: [{ ContainerPort: 4000, Protocol: tcp }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '4000' }
            - { Name: SERVICE_NAME, Value: graphql-server }
            - { Name: DB_HOST, Value: !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-DbWriteEndpoint' } }
            - { Name: DB_PORT, Value: !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-DbPort' } }
            - { Name: DB_NAME, Value: !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-DbName' } }
            - { Name: DB_SSL, Value: 'true' }
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn: !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-DbAppReadWriteSecretArn' }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn: !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-DbAppReadWriteSecretArn' }
            - Name: INTERNAL_API_TOKEN
              ValueFrom: !Ref InternalApiTokenSecret
          HealthCheck:
            Command: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/healthz || exit 1']
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: graphql-server
              mode: non-blocking
              max-buffer-size: 25m

  # ------------------------------------------------------------- internal ALB
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      Subnets:
        - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-PrivateSubnet1Id' }
        - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-PrivateSubnet2Id' }
      SecurityGroups:
        - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlbSecurityGroupId' }
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: idle_timeout.timeout_seconds, Value: '60' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      VpcId: !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-VpcId' }
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If [InternalTls, 443, 80]
      Protocol: !If [InternalTls, HTTPS, HTTP]
      SslPolicy: !If [InternalTls, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      Certificates: !If [InternalTls, [{ CertificateArn: !Ref InternalCertificateArn }], !Ref AWS::NoValue]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  InternalDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: InternalTls
    Properties:
      HostedZoneId: !Ref PrivateHostedZoneId
      Name: !Ref InternalDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # ------------------------------------------------------------------ service
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: graphql-server
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      # DesiredCount intentionally omitted: Application Auto Scaling owns it, so
      # stack updates never reset a scaled-out service.
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-PrivateSubnet1Id' }
            - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-PrivateSubnet2Id' }
          SecurityGroups:
            - !ImportValue { 'Fn::Sub': '${AppName}-${Stage}-EcsSecurityGroupId' }
      LoadBalancers:
        - ContainerName: graphql-server
          ContainerPort: 4000
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # Automatic rollback #1: tasks that never become healthy.
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        # Automatic rollback #2: new tasks are healthy but serve 5xx.
        Alarms:
          AlarmNames: [!Ref Target5xxAlarm]
          Enable: true
          Rollback: true

  # ------------------------------------------------------------- auto scaling
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AppName}-${Stage}-graphql-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  RequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AppName}-${Stage}-graphql-requests'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 500
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${LoadBalancer.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}'

  # ------------------------------------------------------------------- alarms
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-${Stage}-graphql-server-5xx'
      AlarmDescription: Private GraphQL server returning 5xx (also triggers ECS deployment rollback)
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]
      OKActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-${Stage}-graphql-server-p95-latency'
      AlarmDescription: Private GraphQL server p95 response time above 1 s
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-${Stage}-graphql-server-unhealthy-hosts'
      AlarmDescription: At least one ECS task is failing ALB health checks
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-${Stage}-graphql-server-cpu-high'
      AlarmDescription: Service CPU above 85% (auto scaling may be at MaxTasks)
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]

  MemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-${Stage}-graphql-server-memory-high'
      AlarmDescription: Service memory above 85%
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]

  RunningTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-${Stage}-graphql-server-running-tasks-low'
      AlarmDescription: Fewer running tasks than the configured minimum
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref MinTasks
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue { 'Fn::Sub': '${AppName}-${Stage}-AlarmTopicArn' }]

Outputs:
  InternalApiUrl:
    Description: Base URL of the private GraphQL server (resolvable only inside the VPC)
    Value: !If
      - InternalTls
      - !Sub 'https://${InternalDomainName}'
      - !Sub 'http://${LoadBalancer.DNSName}'
  InternalApiTokenSecretArn:
    Value: !Ref InternalApiTokenSecret
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub '${AppName}-${Stage}-EcsClusterName' }
  ServiceName:
    Value: !GetAtt Service.Name
    Export: { Name: !Sub '${AppName}-${Stage}-EcsServiceName' }
  LoadBalancerFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export: { Name: !Sub '${AppName}-${Stage}-AlbFullName' }
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub '${AppName}-${Stage}-TargetGroupFullName' }
